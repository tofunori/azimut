name: Pages

# Publishes the project site (site/, French at / and English at /en/) with the example
# quality reports under /exemples/. Needs GitHub Pages enabled with "GitHub Actions" as
# source (Settings > Pages); until then the job is allowed to fail without turning the
# commit red.
on:
  push:
    branches: [main]
    paths: ["site/**", "examples/**", "docs/img/**", "scripts/build-site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: scripts/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
