[workspace]
resolver = "2"
members = ["crates/azimut-io", "crates/azimut-solve", "crates/azimut-export", "crates/azimut-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "BSD-2-Clause"
repository = "https://github.com/tofunori/azimut"
authors = ["Azimut contributors"]

[workspace.dependencies]
azimut-io = { path = "crates/azimut-io", version = "0.1.0" }
azimut-solve = { path = "crates/azimut-solve", version = "0.1.0" }
azimut-export = { path = "crates/azimut-export", version = "0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = "0.37"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tempfile = "3.13"

[profile.release]
lto = "thin"
codegen-units = 1
