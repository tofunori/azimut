[package]
name = "azimut-io"
description = "Header-only readers for DJI drone survey data (MRK, XMP in JPEG/TIFF), flight inventory and Mavic 3M capture grouping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Generators for small, metadata-only test datasets that mimic the documented DJI layout.
synthetic = []

[dependencies]
chrono.workspace = true
quick-xml.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
walkdir.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
azimut-io = { path = ".", features = ["synthetic"] }
