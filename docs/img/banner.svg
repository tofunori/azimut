<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Azimut: open-source PPK geotagging for DJI survey drones">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2236"/>
      <stop offset=".55" stop-color="#123a5e"/>
      <stop offset="1" stop-color="#0f4a5c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd0b0"/>
      <stop offset="1" stop-color="#2a78d6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2236" stop-opacity="1"/>
      <stop offset=".2" stop-color="#0b2236" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#sky)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <!-- survey flight lines with camera positions -->
  <g transform="translate(1000 52)">
    <g fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2">
      <path d="M0 0 H210 V44 H0 V88 H210 V132 H0 V176 H210 V220 H0"/>
    </g>
    <g fill="#3fd0b0">
      <g id="row"><circle cx="0" cy="0" r="4"/><circle cx="35" cy="0" r="4"/><circle cx="70" cy="0" r="4"/><circle cx="105" cy="0" r="4"/><circle cx="140" cy="0" r="4"/><circle cx="175" cy="0" r="4"/><circle cx="210" cy="0" r="4"/></g>
      <use href="#row" y="44"/><use href="#row" y="88"/><use href="#row" y="132"/><use href="#row" y="176"/><use href="#row" y="220"/>
    </g>
    <circle cx="140" cy="88" r="9" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <rect width="1280" height="320" fill="url(#fade)"/>
  <!-- logo mark -->
  <g transform="translate(88 70) scale(1.4)">
    <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
    <path d="M64 64 L64 26 A38 38 0 0 1 97.55 46.16 Z" fill="url(#arc)" fill-opacity=".9"/>
    <path d="M64 13 L69 24 L59 24 Z" fill="#ffffff"/>
    <line x1="64" y1="64" x2="97.55" y2="46.16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="97.55" cy="46.16" r="6.5" fill="#ffffff"/>
    <circle cx="97.55" cy="46.16" r="2.6" fill="#2a78d6"/>
    <circle cx="64" cy="64" r="4.5" fill="#ffffff"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="300" y="168" font-size="88" font-weight="700" letter-spacing="-1">Azimut</text>
    <text x="304" y="214" font-size="27" fill-opacity=".85">Open-source PPK geotagging for DJI survey drones</text>
    <g font-size="17" fill-opacity=".9">
      <g transform="translate(304 244)">
        <rect width="62" height="32" rx="16" fill="#ffffff" fill-opacity=".1"/><text x="31" y="22" text-anchor="middle">PPK</text>
        <rect x="72" width="112" height="32" rx="16" fill="#ffffff" fill-opacity=".1"/><text x="128" y="22" text-anchor="middle">Mavic 3M</text>
        <rect x="194" width="118" height="32" rx="16" fill="#ffffff" fill-opacity=".1"/><text x="253" y="22" text-anchor="middle">CGVD2013</text>
        <rect x="322" width="122" height="32" rx="16" fill="#ffffff" fill-opacity=".1"/><text x="383" y="22" text-anchor="middle">PIX4Dmatic</text>
        <rect x="454" width="80" height="32" rx="16" fill="#ffffff" fill-opacity=".1"/><text x="494" y="22" text-anchor="middle">ODM</text>
      </g>
    </g>
  </g>
</svg>
