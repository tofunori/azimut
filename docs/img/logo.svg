<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Azimut logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a5e"/>
      <stop offset="1" stop-color="#0b2236"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd0b0"/>
      <stop offset="1" stop-color="#2a78d6"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- compass ring with ticks -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
  <g stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
    <line x1="102" y1="64" x2="96" y2="64"/><line x1="64" y1="102" x2="64" y2="96"/><line x1="26" y1="64" x2="32" y2="64"/>
  </g>
  <!-- azimuth sector from north, clockwise 62 degrees -->
  <path d="M64 64 L64 26 A38 38 0 0 1 97.55 46.16 Z" fill="url(#arc)" fill-opacity=".9"/>
  <!-- north mark -->
  <path d="M64 13 L69 24 L59 24 Z" fill="#ffffff"/>
  <!-- bearing line to the camera position -->
  <line x1="64" y1="64" x2="97.55" y2="46.16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="97.55" cy="46.16" r="6.5" fill="#ffffff"/>
  <circle cx="97.55" cy="46.16" r="2.6" fill="#2a78d6"/>
  <circle cx="64" cy="64" r="4.5" fill="#ffffff"/>
</svg>
